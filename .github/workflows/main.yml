name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target VocalAtmosphere_VST3 --parallel 2

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Vocal-Atmosphere-Windows-VST3
          path: build/VocalAtmosphere_artefacts/Release/VST3/Vocal Atmosphere.vst3
          if-no-files-found: error
